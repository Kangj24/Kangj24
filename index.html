<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>2FA TOTP Generator (64-char support)</title>
  <script src="https://unpkg.com/@otplib/preset-browser@12.0.1"></script>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 50px; }
    input { padding: 10px; width: 80%; font-size: 16px; }
    .code { font-size: 32px; margin-top: 20px; font-weight: bold; }
    .timer { font-size: 14px; color: #777; }
  </style>
</head>
<body>

  <h1>2FA TOTP Generator</h1>
  <input type="text" id="secretInput" placeholder="Masukkan Base32 Secret (max 64 karakter)" maxlength="64"/>
  <div class="code" id="code">Kode: -</div>
  <div class="timer" id="timer">Waktu tersisa: -</div>

  <script>
    const otplib = window.otplib;
    const input = document.getElementById('secretInput');
    const codeElem = document.getElementById('code');
    const timerElem = document.getElementById('timer');

    function updateCode() {
      const secret = input.value.trim().replace(/\s/g, '');
      if (secret.length < 16 || secret.length > 64) {
        codeElem.textContent = 'Kode: (secret tidak valid)';
        return;
      }
      try {
        const token = otplib.authenticator.generate(secret);
        codeElem.textContent = 'Kode: ' + token;
      } catch (e) {
        codeElem.textContent = 'Kode: (gagal generate)';
      }
    }

    function updateTimer() {
      const remaining = 30 - Math.floor(Date.now() / 1000) % 30;
      timerElem.textContent = `Waktu tersisa: ${remaining} detik`;
    }

    input.addEventListener('input', updateCode);
    setInterval(() => {
      updateCode();
      updateTimer();
    }, 1000);

    // Menangani URL parameter untuk secret
    const urlParams = new URLSearchParams(window.location.search);
    const urlSecret = urlParams.get('secret');
    if (urlSecret) {
      input.value = urlSecret;
      updateCode();
    }
  </script>

</body>
</html>
